[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "jlogtail"
version = "0.1.1"
description = "Tail large JSON Lines transcripts by record or byte window."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "El Fenomeno" }]
keywords = ["jsonl", "tail", "transcript", "logs", "rust"]

[project.scripts]
jlogtail = "jlogtail.cli:main"

[tool.maturin]
bindings = "pyo3"
python-source = "python"
module-name = "jlogtail._native"
manifest-path = "Cargo.toml"
features = ["extension-module"]
